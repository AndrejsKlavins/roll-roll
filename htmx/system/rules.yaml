# RPG system definition. Loaded once at server startup — restart after editing.
#
# Sections (or single number fields) marked "base: true" get base values. While a
# character is in creation they are edited freely and nothing is logged. "Finish
# character" locks them in as base values; changes during play are shown against
# the base, e.g. "3 (base 4)".
#
# Field types:
#   number  — stepper with − / + buttons (min, max, default)
#   track   — row of clickable pips from 0 to max (default)
#   text    — free text box (lines = height)
#
# Any field can have a look:
#   icon    — file in system/icons/ (SVG recommended; drawn in white on the colour)
#             or a short text/emoji, e.g. icon: "⚔"
#   color   — hex colour in quotes, e.g. color: "#99342c"
#
# Formulas (derived values and rolls) can use:
#   field ids and earlier derived ids, numbers, + - * / ( ),
#   floor() ceil() round() min() max() abs()
#   dice (rolls only): 2d6, d20, (body + athletics)d6
# Field ids must not look like dice (d6, d20).

name: Sample System

# Named word scales. A number field (or section) with "scale: <name>" shows the word and
# one dot per point in its colour instead of the number.
scales:
  rating:
    1: horrible
    2: low
    3: average
    4: high
    5: excellent

sections:
  - label: Bio
    fields:
      # "full_name" (not "name") so it doesn't get confused with the login/character
      # identity name used for join and the top bar — that one is set at character creation.
      - { id: full_name, label: Name,       type: text, lines: 1 }
      - { id: age,        label: Age,        type: text, lines: 1 }
      - { id: profession, label: Profession, type: text, lines: 1 }
      - { id: race,       label: Race,       type: text, lines: 1 }

  - label: Core Abilities
    base: true
    scale: rating
    fields:
      - { id: strength,   label: Strength,   type: number, min: 1, max: 5, default: 3, icon: strength.svg,   color: "#99342c" }
      - { id: agility,    label: Agility,    type: number, min: 1, max: 5, default: 3, icon: agility.svg,    color: "#899937" }
      - { id: perception, label: Perception, type: number, min: 1, max: 5, default: 3, icon: perception.svg, color: "#dba34f" }
      - { id: knowledge,  label: Knowledge,  type: number, min: 1, max: 5, default: 3, icon: knowledge.svg,  color: "#8ab8ac" }
      - { id: intuition,  label: Intuition,  type: number, min: 1, max: 5, default: 3, icon: intuition.svg,  color: "#8a4368" }

  - label: Supporting Abilities
    base: true
    scale: rating
    fields:
      - { id: endurance, label: Endurance, type: number, min: 1, max: 5, default: 3, icon: endurance.svg, color: "#69302b" }
      - { id: resolve,   label: Resolve,   type: number, min: 1, max: 5, default: 3, icon: resolve.svg,   color: "#2e4c5e" }

  - label: Skills
    base: true
    fields:
      - { id: melee_combat,  label: Melee combat,  type: number, min: 0, max: 5, default: 0 }
      - { id: ranged_combat, label: Ranged combat, type: number, min: 0, max: 5, default: 0 }
      - { id: manipulation,  label: Manipulation,  type: number, min: 0, max: 5, default: 0 }
      - { id: performance,   label: Performance,   type: number, min: 0, max: 5, default: 0 }
      - { id: acrobatics,    label: Acrobatics,    type: number, min: 0, max: 5, default: 0 }
      - { id: athletics,     label: Athletics,     type: number, min: 0, max: 5, default: 0 }
      - { id: stealth,       label: Stealth,       type: number, min: 0, max: 5, default: 0 }
      - { id: medicine,      label: Medicine,      type: number, min: 0, max: 5, default: 0 }
      - { id: theory,        label: Theory,        type: number, min: 0, max: 5, default: 0 }
      - { id: thieving,      label: Thieving,      type: number, min: 0, max: 5, default: 0 }
      - { id: crafting,      label: Crafting,      type: number, min: 0, max: 5, default: 0 }
      - { id: outdoorsman,   label: Outdoorsman,   type: number, min: 0, max: 5, default: 0 }

  - label: Gear & Notes
    fields:
      - { id: gear,  label: Gear,  type: text, lines: 4 }
      - { id: notes, label: Notes, type: text, lines: 3 }

derived:
  - { id: body,               label: Body,               formula: "endurance + floor(strength / 2)" }
  - { id: mind,                label: Mind,               formula: "resolve + floor(intuition / 2)" }
  - { id: speed,               label: Speed,              formula: "floor((agility + perception) / 2)" }
  - { id: evasion,             label: Evasion,            formula: "1 + agility + perception" }
  - { id: physical_resistance, label: Physical Resistance, formula: "2 + endurance" }
  - { id: mental_resistance,   label: Mental Resistance,  formula: "2 + resolve" }
  - { id: stamina,             label: Stamina,            formula: "endurance" }
  - { id: willpower,           label: Willpower,          formula: "resolve" }

# Rolls intentionally left empty: the real rolling system (special dice, exertion,
# skill distribution, difficulty) hasn't been ported from the Godot project yet.
rolls: []
