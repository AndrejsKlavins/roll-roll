# RPG system definition. Loaded once at server startup — restart after editing.
#
# Sections (or single number fields) marked "base: true" get base values. While a
# character is in creation they are edited freely and nothing is logged. "Finish
# character" locks them in as base values; changes during play are shown against
# the base, e.g. "3 (base 4)".
#
# Field types:
#   number  — stepper with − / + buttons (min, max, default)
#   track   — row of clickable pips from 0 to max (default)
#   text    — free text box (lines = height)
#   level   — the character's level with a "Level up" button (one per sheet; needs "training:")
#   derived — calculated number (formula); can be placed in any section. Finished characters
#             can apply play changes with ✎. "pool: true" makes the formula a maximum shown
#             as circles (filled = left, empty = spent), e.g. Health.
#
# Any field can have a look:
#   icon    — file in system/icons/ (SVG recommended; drawn in white on the colour)
#             or a short text/emoji, e.g. icon: "⚔"
#   color   — hex colour in quotes, e.g. color: "#99342c"
#
# Formulas (derived values and rolls) can use:
#   field ids and earlier derived ids, numbers, + - * / ( ),
#   floor() ceil() round() min() max() abs()
#   dice (rolls only): 2d6, d20, (body + athletics)d6
# Field ids must not look like dice (d6, d20).
#
# Traits: bundled adjustments a player can pick instead of hand-editing steppers (up to 8,
# both during creation and, if the GM allows it, later — adding/dropping one on a finished
# character is a base-value change, logged like any other). "cost" runs -2..2 (negative =
# buff, positive = flaw, 0 = a mix); it is advisory only — the running total vs. "power_level"
# is shown but nothing is blocked. "power_level" is the GM's default target; adjustable at
# the table from the GM page without editing this file.
#
# Each modifier targets either an untrained base field (ability) with "delta" (nudges it,
# e.g. -1..2), or a trained field (skill) with "skill_points" (pre-loads that many points —
# same currency as training — which may push its rank up once enough are on it).
#
# Every trait belongs to one of "categories" (each gets its own "add" picker on the
# sheet). "max" caps how many from that category can be picked at once (omit for no
# cap) — once hit, that category's "add" picker is hidden, e.g. Origin: max 1.
#
# "tags" (optional) make traits mutually exclusive: picking one hides every other trait
# sharing any of its tags, e.g. Strong/Very strong/Weak/Very weak all tagged "base_strength"
# so only one Strength-affecting basic trait can ever be picked at once.

name: Sample System

# Named word scales. A number field (or section) with "scale: <name>" shows the word and
# one dot per point in its colour instead of the number.
scales:
  rating:
    0: abysmal
    1: horrible
    2: low
    3: average
    4: high
    5: excellent
    6: epic
  skill:
    0: untrained
    1: novice
    2: experienced
    3: advanced
    4: expert
    5: master

# Skill point training. Finishing a character and each level up grant the value of
# points_stat. Rank n costs rank_costs[n-1] more points: 4, 5, 6, 7, 8 → 4, 9, 15, 22, 30 total.
training:
  points_stat: skill_points
  rank_costs: [4, 5, 6, 7, 8]

traits:
  power_level: 0
  categories:
    - { id: basic,      label: Basic }
    - { id: background, label: Background }
    - { id: origin,     label: Origin, max: 1 }
    - { id: physique,   label: Physique }
  list:
    - { id: city_born,   label: City-born,   category: origin,     cost: -1, description: "Raised in the streets; sharp and street-smart.", modifiers: [{ field: perception, delta: 1 }] }
    - { id: wilds_born,  label: Wilds-born,  category: origin,     cost: -1, description: "Raised far from town, living off the land.",      modifiers: [{ field: endurance, delta: 1 }] }
    - { id: noble_born,  label: Noble-born,  category: origin,     cost: -1, description: "Raised with tutors and easy answers.",            modifiers: [{ field: knowledge, delta: 1 }] }
    # Stealth (Big/Small) and the performance/manipulation roll bonus (Beautiful/Ugly) are
    # situational, not a stat we can automate yet (no roll system, no per-roll modifiers) — kept
    # in the description only, for whoever resolves the roll to apply by hand.
    - { id: big,       label: Big,       category: physique, cost: -1, description: "+1 Strength, +1 Endurance, -1 Evasion, -1 Speed, -2 Stealth.", modifiers: [{ field: strength, delta: 1 }, { field: endurance, delta: 1 }, { field: evasion, delta: -1 }, { field: speed, delta: -1 }] }
    - { id: thin,      label: Thin,      category: physique, cost: 0,  description: "+1 Agility, +1 Evasion, -1 Strength, -1 Physical resistance.", modifiers: [{ field: agility, delta: 1 }, { field: evasion, delta: 1 }, { field: strength, delta: -1 }, { field: physical_resistance, delta: -1 }] }
    - { id: small,     label: Small,     category: physique, cost: 1,  description: "-1 Strength, -1 Endurance, +1 Evasion, +1 Speed, +2 Stealth.", modifiers: [{ field: strength, delta: -1 }, { field: endurance, delta: -1 }, { field: evasion, delta: 1 }, { field: speed, delta: 1 }] }
    - { id: fat,       label: Fat,       category: physique, cost: 0,  description: "-1 Agility, -1 Evasion, +1 Strength, +1 Physical resistance.", modifiers: [{ field: agility, delta: -1 }, { field: evasion, delta: -1 }, { field: strength, delta: 1 }, { field: physical_resistance, delta: 1 }] }
    - { id: stocky,    label: Stocky,    category: physique, cost: -1, description: "+1 Endurance, +1 Physical resistance.",                        modifiers: [{ field: endurance, delta: 1 }, { field: physical_resistance, delta: 1 }] }
    - { id: delicate,  label: Delicate,  category: physique, cost: 1,  description: "-1 Endurance, -1 Physical resistance.",                        modifiers: [{ field: endurance, delta: -1 }, { field: physical_resistance, delta: -1 }] }
    - { id: beautiful, label: Beautiful, category: physique, cost: 0,  description: "+2 to relevant performance and manipulation rolls, -1 Resolve.", modifiers: [{ field: resolve, delta: -1 }] }
    - { id: ugly,      label: Ugly,      category: physique, cost: 0,  description: "-2 to relevant performance and manipulation rolls, +1 Resolve.", modifiers: [{ field: resolve, delta: 1 }] }
    - { id: strong,               label: Strong,               category: basic, tags: [base_strength],   cost: -1, description: "+1 Strength",   modifiers: [{ field: strength, delta: 1 }] }
    - { id: very_strong,          label: Very strong,          category: basic, tags: [base_strength],   cost: -2, description: "+2 Strength",   modifiers: [{ field: strength, delta: 2 }] }
    - { id: weak,                 label: Weak,                 category: basic, tags: [base_strength],   cost: 1,  description: "-1 Strength",   modifiers: [{ field: strength, delta: -1 }] }
    - { id: very_weak,            label: Very weak,            category: basic, tags: [base_strength],   cost: 2,  description: "-2 Strength",   modifiers: [{ field: strength, delta: -2 }] }
    - { id: agile,                label: Agile,                category: basic, tags: [base_agility],    cost: -1, description: "+1 Agility",    modifiers: [{ field: agility, delta: 1 }] }
    - { id: very_agile,           label: Very agile,           category: basic, tags: [base_agility],    cost: -2, description: "+2 Agility",    modifiers: [{ field: agility, delta: 2 }] }
    - { id: clumsy,               label: Clumsy,               category: basic, tags: [base_agility],    cost: 1,  description: "-1 Agility",    modifiers: [{ field: agility, delta: -1 }] }
    - { id: very_clumsy,          label: Very clumsy,          category: basic, tags: [base_agility],    cost: 2,  description: "-2 Agility",    modifiers: [{ field: agility, delta: -2 }] }
    - { id: perceptive,           label: Perceptive,           category: basic, tags: [base_perception], cost: -1, description: "+1 Perception", modifiers: [{ field: perception, delta: 1 }] }
    - { id: very_perceptive,      label: Very perceptive,      category: basic, tags: [base_perception], cost: -2, description: "+2 Perception", modifiers: [{ field: perception, delta: 2 }] }
    - { id: imperceptive,         label: Imperceptive,         category: basic, tags: [base_perception], cost: 1,  description: "-1 Perception", modifiers: [{ field: perception, delta: -1 }] }
    - { id: very_imperceptive,    label: Very imperceptive,    category: basic, tags: [base_perception], cost: 2,  description: "-2 Perception", modifiers: [{ field: perception, delta: -2 }] }
    - { id: knowledgeable,        label: Knowledgable,         category: basic, tags: [base_knowledge],  cost: -1, description: "+1 Knowledge",  modifiers: [{ field: knowledge, delta: 1 }] }
    - { id: very_knowledgeable,   label: Very knowledgable,    category: basic, tags: [base_knowledge],  cost: -2, description: "+2 Knowledge",  modifiers: [{ field: knowledge, delta: 2 }] }
    - { id: unschooled,           label: Unschooled,           category: basic, tags: [base_knowledge],  cost: 1,  description: "-1 Knowledge",  modifiers: [{ field: knowledge, delta: -1 }] }
    - { id: very_unschooled,      label: Very unschooled,      category: basic, tags: [base_knowledge],  cost: 2,  description: "-2 Knowledge",  modifiers: [{ field: knowledge, delta: -2 }] }
    - { id: intuitive,            label: Intuitive,            category: basic, tags: [base_intuition],  cost: -1, description: "+1 Intuition",  modifiers: [{ field: intuition, delta: 1 }] }
    - { id: very_intuitive,       label: Very intuitive,       category: basic, tags: [base_intuition],  cost: -2, description: "+2 Intuition",  modifiers: [{ field: intuition, delta: 2 }] }
    - { id: unintuitive,          label: Unintuitive,          category: basic, tags: [base_intuition],  cost: 1,  description: "-1 Intuition",  modifiers: [{ field: intuition, delta: -1 }] }
    - { id: very_unintuitive,     label: Very unintuitive,     category: basic, tags: [base_intuition],  cost: 2,  description: "-2 Intuition",  modifiers: [{ field: intuition, delta: -2 }] }
    - { id: jack_of_all, label: Jack of all, category: background, cost: 0,  description: "Well-read, but never bulked up.",                  modifiers: [{ field: knowledge, delta: 1 }, { field: strength, delta: -1 }] }
    - { id: hunter_background, label: Hunter background, category: background, cost: -2, description: "Grew up hunting and living off the land.", modifiers: [{ field: outdoorsman, skill_points: 4 }, { field: ranged_combat, skill_points: 4 }] }

sections:
  - label: Bio
    fields:
      # "full_name" (not "name") so it doesn't get confused with the login/character
      # identity name used for join and the top bar — that one is set at character creation.
      - { id: full_name, label: Name,       type: text, lines: 1 }
      - { id: age,        label: Age,        type: text, lines: 1 }
      - { id: profession, label: Profession, type: text, lines: 1 }
      - { id: race,       label: Race,       type: text, lines: 1 }
      # Level counter + "Level up" button (each level up grants Max skill points).
      - { id: level,      label: Level,      type: level }

  # No min/max: abilities scale indefinitely either way. The "rating" scale's own top and
  # bottom step (excellent/epic... abysmal) is used for anything beyond its defined range.
  - label: Core Abilities
    base: true
    scale: rating
    fields:
      - { id: strength,   label: Strength,   type: number, default: 3, icon: strength.svg,   color: "#c74446" }
      - { id: agility,    label: Agility,    type: number, default: 3, icon: agility.svg,    color: "#a7a758" }
      - { id: perception, label: Perception, type: number, default: 3, icon: perception.svg, color: "#ebac4d" }
      - { id: knowledge,  label: Knowledge,  type: number, default: 3, icon: knowledge.svg,  color: "#7dadc8" }
      - { id: intuition,  label: Intuition,  type: number, default: 3, icon: intuition.svg,  color: "#af6d77" }

  - label: Supporting Abilities
    base: true
    scale: rating
    fields:
      - { id: endurance, label: Endurance, type: number, default: 3, icon: endurance.svg, color: "#975638" }
      - { id: resolve,   label: Resolve,   type: number, default: 3, icon: resolve.svg,   color: "#556a97" }

  # Calculated stats (type: derived) — read-only numbers worked out from the formula.
  - label: Body
    fields:
      - { id: health, label: Health, type: derived, pool: true, formula: "endurance + floor(strength / 2)", icon: health.svg, color: "#c74446" }
      - { id: mind,   label: Mind,   type: derived, pool: true, formula: "resolve + floor(intuition / 2)",  icon: mind.svg,   color: "#5c81a3" }

  - label: Reserves
    fields:
      - { id: stamina,   label: Stamina,   type: derived, pool: true, formula: "endurance", icon: stamina.svg,   color: "#d0763e" }
      - { id: willpower, label: Willpower, type: derived, pool: true, formula: "resolve",   icon: willpower.svg, color: "#7dadc8" }

  - label: Defense
    fields:
      - { id: evasion,             label: Evasion,             type: derived, formula: "1 + agility + perception", icon: evasion.svg,             color: "#a7a758" }
      - { id: physical_resistance, label: Physical resistance, type: derived, formula: "2 + endurance",            icon: physical_resistance.svg, color: "#a6a6a6" }
      - { id: mental_resistance,   label: Mental resistance,   type: derived, formula: "2 + resolve",              icon: mental_resistance.svg,   color: "#b0d6d9" }

  - label: Misc
    fields:
      - { id: speed, label: Speed, type: derived, formula: "floor((agility + perception) / 2)", icon: speed.svg, color: "#f2d08d" }
      # Skill points gained per level (and on finishing the character). "base: true" = only base
      # ability values count, so temporary changes to Knowledge etc. don't affect it.
      - { id: skill_points, label: Max skill points, type: derived, base: true, formula: "3 + knowledge + intuition + resolve", icon: skill_points.svg, color: "#f2d08d" }

  - label: Skills
    trained: true   # rank comes from skill points assigned in training mode (see "training:")
    scale: skill
    fields:
      # Combat
      - { id: melee_combat,  label: Melee combat,  type: number, min: 0, max: 5, default: 0, icon: melee_combat.svg,  color: "#c68d80" }
      - { id: ranged_combat, label: Ranged combat, type: number, min: 0, max: 5, default: 0, icon: ranged_combat.svg, color: "#c68d80" }
      # Social
      - { id: manipulation,  label: Manipulation,  type: number, min: 0, max: 5, default: 0, icon: manipulation.svg,  color: "#ddac88" }
      - { id: performance,   label: Performance,   type: number, min: 0, max: 5, default: 0, icon: performance.svg,   color: "#ddac88" }
      # Physical
      - { id: acrobatics,    label: Acrobatics,    type: number, min: 0, max: 5, default: 0, icon: acrobatics.svg,    color: "#cfccca" }
      - { id: athletics,     label: Athletics,     type: number, min: 0, max: 5, default: 0, icon: athletics.svg,     color: "#cfccca" }
      - { id: stealth,       label: Stealth,       type: number, min: 0, max: 5, default: 0, icon: stealth.svg,       color: "#cfccca" }
      # Other
      - { id: medicine,      label: Medicine,      type: number, min: 0, max: 5, default: 0, icon: medicine.svg,      color: "#f2d08d" }
      - { id: theory,        label: Theory,        type: number, min: 0, max: 5, default: 0, icon: theory.svg,        color: "#f2d08d" }
      - { id: thieving,      label: Thieving,      type: number, min: 0, max: 5, default: 0, icon: thieving.svg,      color: "#f2d08d" }
      - { id: crafting,      label: Crafting,      type: number, min: 0, max: 5, default: 0, icon: crafting.svg,      color: "#f2d08d" }
      - { id: outdoorsman,   label: Outdoorsman,   type: number, min: 0, max: 5, default: 0, icon: outdoorsman.svg,   color: "#f2d08d" }

  - label: Gear & Notes
    fields:
      - { id: gear,  label: Gear,  type: text, lines: 4 }
      - { id: notes, label: Notes, type: text, lines: 3 }

# Calculated values not placed in a section are listed here and shown in a compact block
# at the bottom of the sheet. All current ones live in the sections above.
derived: []

# Rolls intentionally left empty: the real rolling system (special dice, exertion,
# skill distribution, difficulty) hasn't been ported from the Godot project yet.
rolls: []
